<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Posters admin — ChaudharykiDiary</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <nav class="navbar">
    <span class="logo"><img class="logo-mark" src="favicon.png" alt="" />ChaudharykiDiary</span>
    <div class="nav-actions">
      <span class="user-label" id="userLabel" hidden></span>
      <button type="button" class="theme-toggle" id="logoutBtn" hidden>Log out</button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </nav>

  <main>
    <section class="login" id="loginView">
      <h1>Posters admin</h1>
      <p>Sign in with GitHub to reorder, rename, hide, or add prints.</p>
      <a class="btn-primary" href="/auth/login">Sign in with GitHub</a>
      <p class="hint" id="loginHint"></p>
    </section>

    <section id="appView" hidden>
      <header class="page-head">
        <div>
          <p class="kicker">Admin</p>
          <h1>Posters</h1>
        </div>
        <div class="page-head-actions">
          <p class="status" id="status" hidden></p>
          <button type="button" class="btn-secondary" id="openAddBtn">Add poster</button>
          <button type="button" class="btn-primary" id="saveBtn" disabled>Save</button>
        </div>
      </header>

      <p class="error" id="error" hidden></p>

      <ul class="poster-list" id="posterList"></ul>
    </section>
  </main>

  <dialog id="addDialog" class="add-dialog" aria-labelledby="addDialogTitle">
    <button type="button" class="add-dialog-close" id="addDialogClose" aria-label="Close">&times;</button>
    <form class="add-card" id="addForm">
      <h2 id="addDialogTitle">Add poster</h2>
      <label>
        Title
        <input type="text" name="title" required maxlength="120" placeholder="Film title" />
      </label>
      <label>
        Collection
        <select name="collection" id="addCollection"></select>
      </label>
      <div class="add-row">
        <label>
          Upload image
          <input type="file" name="file" accept="image/jpeg,image/png,image/webp,image/gif" />
        </label>
        <label>
          Or image URL
          <input type="url" name="url" placeholder="https://…" />
        </label>
      </div>
      <p class="error" id="addError" hidden></p>
      <button type="submit" class="btn-primary" id="addBtn">Add poster</button>
    </form>
  </dialog>

  <div class="unsaved-toast" id="unsavedToast" hidden>
    <p>You have unsaved changes</p>
    <div class="unsaved-toast-actions">
      <button type="button" id="toastDiscard">Discard</button>
      <button type="button" class="btn-primary" id="toastSave">Save</button>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
