name: Sync Posters

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync posters from Google Sheet
        run: bash sync-posters.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ posters.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: update posters from Google Sheet"
            git push
          fi
